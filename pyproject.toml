[project]
name = "smart-select"
version = "0.1.0"
description = "Fine-tuning and benchmarking small models that find the main content of a phone screen"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Ludovic Auberger" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
smart-select = "smart_select.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
classifier = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]
dev = [
    "pytest>=9.2.0",
]
models = [
    "mlx-lm>=0.32.2",
]
