# LoRA on Ministral 3 3B, 8-bit, for smart select: see README, "Fine-tuning"
model: mlx-community/Ministral-3-3B-Instruct-2512-8bit
train: true
data: data/finetune
fine_tune_type: lora
# Learn the answer only, not the page given in the prompt
mask_prompt: true
num_layers: 16
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
batch_size: 1
learning_rate: 1.0e-5
# 527 windows: 2 passes, about 8 s a step on an M1 Pro
iters: 1050
steps_per_report: 20
steps_per_eval: 200
val_batches: 10
save_every: 200
max_seq_length: 4200
grad_checkpoint: true
adapter_path: adapters/ministral-3b
seed: 0
